[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelcraft"
version = "0.1.0"
description = "Effects, stickers and motion graphics for talking-head video, driven by Claude."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.9,<5", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reelcraft = "reelcraft.cli:main"

[tool.setuptools.packages.find]
include = ["reelcraft*"]

[tool.setuptools.package-data]
reelcraft = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
